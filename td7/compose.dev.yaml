services:
  api:
    build: 
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - DB_NAME=td7
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./api/src:/app/src
    depends_on:
      - mongodb
      - redis

  mongodb:
    image: mongo:8.0
    environment:
      - MONGO_INITDB_DATABASE=td7
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
    - "6379:6379"

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    volumes:
      - ./front/src:/app/src
    depends_on:
      - api

  reverseproxy:
    restart: always
    build:
      context: reverse-proxy/
      dockerfile: ./Dockerfile.dev
    depends_on:
      - api
      - front
    volumes:
      - ./reverse-proxy/log:/var/log/nginx
    ports:
      - 80:80

volumes:
  mongodb_data: